apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-generator-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RyanJKS/chaos-generator.git
    targetRevision: HEAD
    path: infrastructure/k8s/apps/chaos-generator/kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-generator-prod-ns
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
