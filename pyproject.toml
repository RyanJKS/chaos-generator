[project]
name = "chaos-generator"
version = "0.1.0"
description = "Control HTTP event traffic with a simple Streamlit app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.37,<2",
    "requests>=2.32,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pre-commit>=4,<5", "ruff==0.12.12", "httpx>=0.27,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
