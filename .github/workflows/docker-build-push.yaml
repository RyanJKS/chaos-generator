name: ci-cd

on:
  workflow_dispatch:
  push:
    paths:
      - src/**
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker-build-push.yaml
    branches:
      - main

permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Declare gh env variables
        shell: bash
        run: |
          echo "sha_short=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chaos-generator:${{ env.sha_short }}
    outputs:
      commit_id: ${{ env.sha_short }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install yq
        shell: bash
        env:
          YQ_VERSION: v4.44.3
        run: |
          mkdir -p "$RUNNER_TEMP/yq-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            --output "$RUNNER_TEMP/yq-bin/yq"
          chmod +x "$RUNNER_TEMP/yq-bin/yq"
          echo "$RUNNER_TEMP/yq-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yq-bin/yq" --version

      - name: Update k8s manifest
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.ci.outputs.commit_id }}
        run: |
          yq -i '.image.tag = strenv(IMAGE_TAG)' infrastructure/k8s/charts/chaos-generator-app/values.yaml

      - name: Commit changes with tag
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update values.yaml with commit ${{ needs.ci.outputs.commit_id }}"

      - name: Install ArgoCD within k8s
        shell: bash
        run: |
          curl -k -sSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: ArgoCD Login
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}

      - name: ArgoCD app sync
        shell: bash
        run: |
          argocd app sync chaos-generator
